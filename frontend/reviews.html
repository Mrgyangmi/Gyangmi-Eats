<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gyangmi Eats - Reviews</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #ff6b00;
      color: white;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 25px;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      margin-left: 20px;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: 30px auto;
    }

    .restaurant-card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .restaurant-card h2 {
      color: #ff6b00;
      margin-bottom: 8px;
    }

    .restaurant-card p {
      color: #666;
    }

    .review-form {
      background: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .review-form h3 {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 18px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      background: #ff6b00;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e85d00;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #e7f8ed;
      color: #187a3d;
    }

    .error {
      background: #ffe8e8;
      color: #c00;
    }

    .reviews-title {
      margin-bottom: 15px;
      font-size: 24px;
    }

    .review-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .review-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .user-name {
      font-weight: bold;
    }

    .stars {
      color: #ffb000;
      font-size: 20px;
      letter-spacing: 2px;
    }

    .comment {
      color: #555;
      line-height: 1.6;
      margin-top: 10px;
    }

    .date {
      color: #999;
      font-size: 13px;
      margin-top: 10px;
    }

    .empty {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 12px;
      color: #777;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media (max-width: 600px) {
      header {
        padding: 15px;
      }

      header h1 {
        font-size: 20px;
      }

      header a {
        margin-left: 10px;
        font-size: 14px;
      }

      .container {
        width: 95%;
      }

      .review-top {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>⭐ Gyangmi Eats Reviews</h1>

    <div>
      <a href="/">Home</a>
      <a href="/cart.html">Cart</a>
    </div>
  </header>


  <div class="container">

    <div id="restaurantInfo">
      <div class="loading">
        Loading restaurant...
      </div>
    </div>


    <div class="review-form">

      <h3>⭐ Write a Review</h3>

      <label for="rating">
        Rating
      </label>

      <select id="rating">

        <option value="5">⭐⭐⭐⭐⭐ - Excellent</option>
        <option value="4">⭐⭐⭐⭐ - Very Good</option>
        <option value="3">⭐⭐⭐ - Good</option>
        <option value="2">⭐⭐ - Not Good</option>
        <option value="1">⭐ - Poor</option>

      </select>


      <label for="comment">
        Your Comment
      </label>

      <textarea
        id="comment"
        placeholder="Write your experience..."
      ></textarea>


      <button onclick="submitReview()">
        Submit Review
      </button>


      <div id="message" class="message"></div>

    </div>


    <h2 class="reviews-title">
      Customer Reviews
    </h2>


    <div id="reviews">
      <div class="loading">
        Loading reviews...
      </div>
    </div>

  </div>


  <script>

    const params =
      new URLSearchParams(window.location.search);


    // Restaurant ID from URL
    const restaurantId =
      Number(params.get("restaurant_id")) || 1;


    // Logged-in user (URL user_id remains a backward-compatible fallback)
    let storedUser = null;
    try {
      storedUser = JSON.parse(
        localStorage.getItem("gyangmiUser") ||
        localStorage.getItem("user") ||
        "null"
      );
    } catch (error) {
      storedUser = null;
    }

    const userId =
      Number(storedUser?.id) ||
      Number(params.get("user_id")) ||
      1;


    async function getData(url) {

      const response =
        await fetch(url);

      if (!response.ok) {
        throw new Error("Failed to load " + url);
      }

      return await response.json();
    }


    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function createStars(rating) {

      const number =
        Number(rating) || 0;

      let stars = "";

      for (let i = 1; i <= 5; i++) {

        if (i <= number) {
          stars += "★";
        } else {
          stars += "☆";
        }

      }

      return stars;
    }


    async function loadRestaurant() {

      try {

        const restaurants =
          await getData("/restaurants");


        const restaurant =
          restaurants.find(
            r => Number(r.id) === restaurantId
          );


        const container =
          document.getElementById(
            "restaurantInfo"
          );


        if (!restaurant) {

          container.innerHTML = `
            <div class="empty">
              Restaurant not found.
            </div>
          `;

          return;
        }


        container.innerHTML = `

          <div class="restaurant-card">

            <h2>
              ${escapeHTML(restaurant.name)}
            </h2>

            <p>
              ${escapeHTML(
                restaurant.description ||
                "Gyangmi Eats Restaurant"
              )}
            </p>

          </div>

        `;

      }

      catch (error) {

        console.error(error);

        document.getElementById(
          "restaurantInfo"
        ).innerHTML = `
          <div class="empty">
            Failed to load restaurant.
          </div>
        `;

      }

    }


    async function loadReviews() {

      try {

        const [
          reviews,
          users
        ] = await Promise.all([

          getData("/reviews"),

          getData("/users")

        ]);


        const restaurantReviews =
          reviews
            .filter(
              r =>
                Number(r.restaurant_id) ===
                restaurantId
            )
            .sort(
              (a, b) =>
                Number(b.id) -
                Number(a.id)
            );


        const container =
          document.getElementById(
            "reviews"
          );


        if (
          restaurantReviews.length === 0
        ) {

          container.innerHTML = `
            <div class="empty">

              <h3>
                No reviews yet ⭐
              </h3>

              <p>
                Be the first customer to review this restaurant.
              </p>

            </div>
          `;

          return;
        }


        let html = "";


        restaurantReviews.forEach(
          review => {

            const user =
              users.find(
                u =>
                  Number(u.id) ===
                  Number(review.user_id)
              );


            const userName =
              user?.name ||
              "Customer";


            const date =
              review.created_at
                ? new Date(
                    review.created_at
                  ).toLocaleString()
                : "";


            html += `

              <div class="review-card">

                <div class="review-top">

                  <div class="user-name">
                    👤 ${escapeHTML(userName)}
                  </div>

                  <div class="stars">
                    ${createStars(
                      review.rating
                    )}
                  </div>

                </div>


                <div class="comment">

                  ${escapeHTML(
                    review.comment ||
                    "No comment"
                  )}

                </div>


                ${
                  date
                    ? `
                      <div class="date">
                        ${escapeHTML(date)}
                      </div>
                    `
                    : ""
                }

              </div>

            `;

          }
        );


        container.innerHTML = html;

      }

      catch (error) {

        console.error(error);

        document.getElementById(
          "reviews"
        ).innerHTML = `
          <div class="empty">
            Failed to load reviews.
          </div>
        `;

      }

    }


    async function submitReview() {

      const rating =
        Number(
          document.getElementById(
            "rating"
          ).value
        );


      const comment =
        document.getElementById(
          "comment"
        ).value.trim();


      const message =
        document.getElementById(
          "message"
        );


      if (!rating) {

        message.className =
          "message error";

        message.style.display =
          "block";

        message.textContent =
          "Please select a rating.";

        return;
      }


      if (!comment) {

        message.className =
          "message error";

        message.style.display =
          "block";

        message.textContent =
          "Please write a comment.";

        return;
      }


      try {

        const response =
          await fetch(
            "/reviews",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                user_id:
                  userId,

                restaurant_id:
                  restaurantId,

                rating:
                  rating,

                comment:
                  comment

              })

            }
          );


        const result =
          await response.text();


        if (!response.ok) {

          throw new Error(result);

        }


        message.className =
          "message success";

        message.style.display =
          "block";

        message.textContent =
          "✅ Review submitted successfully!";


        document.getElementById(
          "comment"
        ).value = "";


        document.getElementById(
          "rating"
        ).value = "5";


        await loadReviews();

      }

      catch (error) {

        console.error(error);

        message.className =
          "message error";

        message.style.display =
          "block";

        message.textContent =
          "❌ Failed to submit review: " +
          error.message;

      }

    }


    loadRestaurant();

    loadReviews();

  </script>

</body>
</html>
