<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gyangmi Eats - Cart</title>

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      background: #f7f7f7;
      color: #222;
      min-height: 100vh;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    header {
      background: rgba(255, 255, 255, 0.97);

      padding: 18px 50px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      box-shadow:
        0 2px 15px rgba(0, 0, 0, 0.07);

      position: sticky;
      top: 0;
      z-index: 100;
    }


    .logo {
      font-size: 32px;
      font-weight: 800;

      color: #ff4b2b;

      letter-spacing: -1px;

      cursor: pointer;
    }


    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }


    .header-link {
      text-decoration: none;

      color: #444;

      font-weight: 600;
      font-size: 15px;

      padding: 10px 13px;

      border-radius: 9px;

      transition: 0.2s;
    }


    .header-link:hover {
      color: #ff4b2b;
      background: #fff2ee;
    }


    .back {
      text-decoration: none;

      color: #444;

      font-weight: 700;
      font-size: 15px;

      padding: 11px 16px;

      border-radius: 10px;

      transition: 0.2s;
    }


    .back:hover {
      color: #ff4b2b;
      background: #fff2ee;
    }


    /* =====================================================
       MAIN SECTION
    ===================================================== */

    .section {
      max-width: 1050px;

      margin: auto;

      padding: 55px 25px 75px;
    }


    .page-heading {
      margin-bottom: 35px;
    }


    .page-heading h1 {
      font-size: 38px;

      line-height: 1.2;

      margin-bottom: 8px;

      letter-spacing: -0.7px;
    }


    .page-heading p {
      color: #777;

      font-size: 16px;
    }


    /* =====================================================
       CART LIST
    ===================================================== */

    .cart-list {
      display: flex;

      flex-direction: column;

      gap: 17px;
    }


    /* =====================================================
       CART ITEM
    ===================================================== */

    .cart-item {
      background: white;

      padding: 21px 23px;

      border-radius: 16px;

      border: 1px solid #eeeeee;

      box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.06);

      display: grid;

      grid-template-columns:
        1fr auto auto auto;

      align-items: center;

      gap: 25px;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }


    .cart-item:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 22px rgba(0, 0, 0, 0.09);
    }


    /* =====================================================
       ITEM INFO
    ===================================================== */

    .item-info h3 {
      margin-bottom: 7px;

      font-size: 20px;

      line-height: 1.35;
    }


    .item-info p {
      color: #777;

      font-size: 14px;

      line-height: 1.5;
    }


    /* =====================================================
       QUANTITY
    ===================================================== */

    .quantity {
      display: flex;

      align-items: center;

      gap: 10px;
    }


    .quantity button {
      width: 34px;
      height: 34px;

      border: none;

      border-radius: 8px;

      background: #ff4b2b;

      color: white;

      font-size: 19px;

      font-weight: bold;

      cursor: pointer;

      transition:
        background 0.2s,
        transform 0.2s;
    }


    .quantity button:hover {
      background: #e83e20;

      transform: scale(1.05);
    }


    .quantity span {
      font-weight: 700;

      min-width: 25px;

      text-align: center;

      font-size: 16px;
    }


    /* =====================================================
       ITEM PRICE
    ===================================================== */

    .item-price {
      color: #ff4b2b;

      font-weight: 800;

      font-size: 19px;

      min-width: 100px;

      text-align: right;
    }


    /* =====================================================
       REMOVE
    ===================================================== */

    .remove {
      border: 1px solid #eeeeee;

      background: #f8f8f8;

      color: #d93025;

      padding: 9px 13px;

      border-radius: 8px;

      cursor: pointer;

      font-weight: 600;

      transition:
        background 0.2s,
        border-color 0.2s;
    }


    .remove:hover {
      background: #fff0ee;

      border-color: #ffd4cd;
    }


    /* =====================================================
       SUMMARY
    ===================================================== */

    .summary {
      background: white;

      margin-top: 30px;

      padding: 27px;

      border-radius: 16px;

      border: 1px solid #eeeeee;

      box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.07);
    }


    .summary-title {
      font-size: 21px;

      font-weight: 700;

      margin-bottom: 22px;
    }


    .summary-row {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 15px;

      font-size: 17px;

      color: #555;
    }


    .summary-row strong {
      color: #222;
    }


    .total {
      font-size: 25px;

      font-weight: 800;

      color: #ff4b2b;

      border-top: 1px solid #e5e5e5;

      margin-top: 8px;

      padding-top: 18px;

      margin-bottom: 0;
    }


    .total span:last-child {
      color: #ff4b2b;
    }


    /* =====================================================
       CHECKOUT
    ===================================================== */

    .checkout {
      width: 100%;

      margin-top: 22px;

      padding: 15px;

      border: none;

      border-radius: 10px;

      background: #ff4b2b;

      color: white;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.2s,
        transform 0.2s,
        box-shadow 0.2s;
    }


    .checkout:hover {
      background: #e83e20;

      transform: translateY(-1px);

      box-shadow:
        0 8px 18px rgba(255, 75, 43, 0.25);
    }


    .checkout:active {
      transform: translateY(1px);
    }


    /* =====================================================
       EMPTY CART
    ===================================================== */

    .empty {
      background: white;

      text-align: center;

      padding: 75px 20px;

      border-radius: 17px;

      border: 1px solid #eeeeee;

      box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.06);

      color: #777;

      font-size: 18px;
    }


    .empty-icon {
      font-size: 55px;

      margin-bottom: 15px;
    }


    .empty h2 {
      color: #333;

      font-size: 24px;

      margin-bottom: 8px;
    }


    .empty p {
      color: #888;

      margin-bottom: 22px;
    }


    .browse-food {
      display: inline-block;

      background: #ff4b2b;

      color: white;

      text-decoration: none;

      padding: 12px 20px;

      border-radius: 9px;

      font-weight: 700;

      transition: 0.2s;
    }


    .browse-food:hover {
      background: #e83e20;
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    footer {
      background: #222;

      color: white;

      text-align: center;

      padding: 35px 20px;

      margin-top: 10px;
    }


    .footer-logo {
      color: #ff5a3c;

      font-size: 21px;

      font-weight: 700;

      margin-bottom: 8px;
    }


    footer p {
      color: #ddd;

      font-size: 14px;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 750px) {

      header {
        padding: 15px 20px;
      }


      .logo {
        font-size: 27px;
      }


      .header-link {
        display: none;
      }


      .back {
        font-size: 14px;

        padding: 9px 10px;
      }


      .section {
        padding: 40px 15px 55px;
      }


      .page-heading h1 {
        font-size: 31px;
      }


      .cart-item {
        grid-template-columns: 1fr auto;

        gap: 17px;
      }


      .item-price {
        text-align: left;

        min-width: auto;
      }


      .remove {
        justify-self: end;
      }


      .quantity {
        justify-self: end;
      }

    }


    @media (max-width: 450px) {

      .cart-item {
        grid-template-columns: 1fr;
      }


      .quantity {
        justify-self: start;
      }


      .item-price {
        text-align: left;
      }


      .remove {
        justify-self: start;
      }


      .summary {
        padding: 22px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       HEADER
  ===================================================== -->

  <header>

    <div
      class="logo"
      onclick="window.location.href='/'"
    >
      Gyangmi Eats
    </div>


    <div class="header-right">

      <a
        class="header-link"
        href="/orders.html"
      >
        📦 Orders
      </a>


      <a
        class="header-link"
        href="/favorites.html"
      >
        ❤️ Favorites
      </a>


      <a
        href="/"
        class="back"
      >
        ← Restaurants
      </a>

    </div>

  </header>


  <!-- =====================================================
       MAIN
  ===================================================== -->

  <section class="section">


    <div class="page-heading">

      <h1>
        🛒 Your Cart
      </h1>


      <p>
        Review your items before checkout.
      </p>

    </div>


    <div
      id="cartList"
      class="cart-list"
    ></div>


    <div
      id="summary"
      class="summary"
    ></div>


  </section>


  <!-- =====================================================
       FOOTER
  ===================================================== -->

  <footer>

    <div class="footer-logo">
      Gyangmi Eats
    </div>


    <p>
      © 2026 Gyangmi Eats. All rights reserved.
    </p>

  </footer>


  <!-- =====================================================
       JAVASCRIPT
  ===================================================== -->

  <script>


    // =====================================================
    // GET CART
    // =====================================================

    let cart =
      JSON.parse(
        localStorage.getItem(
          "foodgo_cart"
        ) || "[]"
      );


    // =====================================================
    // ELEMENTS
    // =====================================================

    const cartList =
      document.getElementById(
        "cartList"
      );


    const summary =
      document.getElementById(
        "summary"
      );


    // =====================================================
    // DISPLAY CART
    // =====================================================

    function displayCart() {


      // ---------------------------------------------------
      // EMPTY CART
      // ---------------------------------------------------

      if (cart.length === 0) {

        cartList.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              🛒
            </div>

            <h2>
              Your cart is empty
            </h2>

            <p>
              Go back and add some delicious food!
            </p>

            <a
              href="/"
              class="browse-food"
            >
              Browse Restaurants
            </a>

          </div>

        `;


        summary.innerHTML = "";

        return;

      }


      // ---------------------------------------------------
      // CART ITEMS
      // ---------------------------------------------------

      cartList.innerHTML =
        cart
          .map(
            (item, index) => {


              const itemTotal =
                Number(item.price) *
                Number(item.quantity);


              return `

                <div
                  class="cart-item"
                >


                  <div
                    class="item-info"
                  >

                    <h3>
                      ${escapeHtml(
                        item.name
                      )}
                    </h3>


                    <p>
                      ¥${Number(
                        item.price
                      ).toLocaleString()}
                      × ${Number(
                        item.quantity
                      )}
                    </p>

                  </div>


                  <div
                    class="quantity"
                  >

                    <button
                      type="button"
                      onclick="decreaseQuantity(${index})"
                    >
                      −
                    </button>


                    <span>
                      ${Number(
                        item.quantity
                      )}
                    </span>


                    <button
                      type="button"
                      onclick="increaseQuantity(${index})"
                    >
                      +
                    </button>

                  </div>


                  <div
                    class="item-price"
                  >

                    ¥${itemTotal.toLocaleString()}

                  </div>


                  <button
                    type="button"
                    class="remove"
                    onclick="removeItem(${index})"
                  >
                    🗑 Remove
                  </button>


                </div>

              `;

            }
          )
          .join("");


      // ===================================================
      // TOTAL
      // ===================================================

      const total =
        cart.reduce(
          (
            sum,
            item
          ) =>
            sum +
            Number(item.price) *
            Number(item.quantity),
          0
        );


      summary.innerHTML = `

        <div class="summary-title">
          Order Summary
        </div>


        <div class="summary-row">

          <span>
            Subtotal
          </span>


          <strong>
            ¥${total.toLocaleString()}
          </strong>

        </div>


        <div class="summary-row">

          <span>
            Delivery Fee
          </span>


          <strong>
            ¥0
          </strong>

        </div>


        <div
          class="summary-row total"
        >

          <span>
            Total
          </span>


          <span>
            ¥${total.toLocaleString()}
          </span>

        </div>


        <button
          type="button"
          class="checkout"
          onclick="checkout()"
        >
          Proceed to Checkout →
        </button>

      `;

    }


    // =====================================================
    // INCREASE QUANTITY
    // =====================================================

    function increaseQuantity(
      index
    ) {

      if (
        !cart[index]
      ) {
        return;
      }


      cart[index].quantity =
        Number(
          cart[index].quantity
        ) + 1;


      saveCart();

    }


    // =====================================================
    // DECREASE QUANTITY
    // =====================================================

    function decreaseQuantity(
      index
    ) {

      if (
        !cart[index]
      ) {
        return;
      }


      if (
        Number(
          cart[index].quantity
        ) > 1
      ) {

        cart[index].quantity =
          Number(
            cart[index].quantity
          ) - 1;

      }

      else {

        cart.splice(
          index,
          1
        );

      }


      saveCart();

    }


    // =====================================================
    // REMOVE ITEM
    // =====================================================

    function removeItem(
      index
    ) {

      if (
        !cart[index]
      ) {
        return;
      }


      cart.splice(
        index,
        1
      );


      saveCart();

    }


    // =====================================================
    // SAVE CART
    // =====================================================

    function saveCart() {

      localStorage.setItem(
        "foodgo_cart",
        JSON.stringify(
          cart
        )
      );


      displayCart();

    }


    // =====================================================
    // CHECKOUT
    // =====================================================

    function checkout() {


      if (
        cart.length === 0
      ) {

        alert(
          "Your cart is empty!"
        );

        return;

      }


      window.location.href =
        "/checkout.html";

    }


    // =====================================================
    // HTML SAFETY
    // =====================================================

    function escapeHtml(
      value
    ) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    // =====================================================
    // START
    // =====================================================

    displayCart();

  </script>


</body>

</html>
